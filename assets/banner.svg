<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
      100% { transform: translateY(0px); }
    }
    .wave-bg { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .pulse-line { stroke-dasharray: 8 6; animation: dash 2s linear infinite; }
    .floating-card1 { animation: float1 4s ease-in-out infinite; }
    .floating-card2 { animation: float2 5s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Dynamic Background Graphics (Pills / Waveform / Nodes behind text) -->
  <g class="wave-bg">
    <circle cx="150" cy="80" r="120" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.15" />
    <circle cx="1050" cy="240" r="140" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.15" />
  </g>

  <!-- Ecg Line Visual (Background layer) -->
  <path d="M 50 240 L 250 240 L 270 200 L 290 270 L 310 160 L 330 250 L 350 240 L 1150 240" 
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" class="pulse-line" />

  <!-- Animated Floating Pill Graphics (Side Decorators) -->
  <g class="floating-card1" opacity="0.4">
    <!-- Capsule 1 -->
    <rect x="70" y="50" width="90" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-25 115 68)" />
    <path d="M 70 50 A 18 18 0 0 0 115 68 L 115 68 A 18 18 0 0 0 70 50 Z" fill="#0284c7" opacity="0.6" transform="rotate(-25 115 68)" />
  </g>

  <g class="floating-card2" opacity="0.4">
    <!-- Shield / Safety Symbol -->
    <path d="M 1070 60 L 1110 80 V 120 C 1110 145 1070 165 1070 165 C 1070 165 1030 145 1030 120 V 80 Z" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
    <path d="M 1060 110 L 1068 118 L 1082 102" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Foreground Content (Title & Subtitle Always On Top) -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="460" y="32" width="280" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="600" y="50" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">
      ⚡ DRUG SAFETY &amp; PV ECOSYSTEM
    </text>

    <!-- Title -->
    <text x="600" y="125" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Drug Safety &amp; Pharmacovigilance
    </text>

    <!-- Subtitle -->
    <text x="600" y="170" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Curated SaaS Platforms, Statistical Signal Detection Tools &amp; Regulatory Open-Source Software
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(300, 210)">
      <!-- Tag 1 -->
      <rect x="40" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="120" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">🛡️ ICSR Case Intake</text>

      <!-- Tag 2 -->
      <rect x="220" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="300" y="21" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="600">📊 Signal Detection</text>

      <!-- Tag 3 -->
      <rect x="400" y="0" width="160" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="480" y="21" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600">🌐 E2B(R3) &amp; FAERS</text>
    </g>

    <!-- Bottom Line -->
    <text x="600" y="285" fill="#64748b" font-family="sans-serif" font-size="13">
      Updated for 2026 • Curated for Life Sciences &amp; Regulatory Professionals
    </text>
  </g>
</svg>
