<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(12px)}}.wave-bg{animation:pulse 6s ease-in-out infinite;transform-origin:center}.pulse-line{stroke-dasharray:8 6;animation:dash 2s linear infinite}.floating-card1{animation:float1 4s ease-in-out infinite}.floating-card2{animation:float2 5s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1196" height="316" x="2" y="2" fill="none" stroke="#334155" stroke-width="2" rx="14"/><g class="wave-bg"><circle cx="150" cy="80" r="120" fill="url(#accentGrad)" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="240" r="140" fill="url(#accentGrad)" filter="url(#glow)" opacity=".15"/></g><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 240 L 250 240 L 270 200 L 290 270 L 310 160 L 330 250 L 350 240 L 1150 240" class="pulse-line" opacity=".25"/><g class="floating-card1" opacity=".4"><rect width="